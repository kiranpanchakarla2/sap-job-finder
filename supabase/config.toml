project_id = "sap-job-finder"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://sapjobsfinder.com"
additional_redirect_urls = [
  "https://sapjobsfinder.com/auth/callback",
  "http://sapjobsfinder.com/auth/callback",
  "http://localhost:3000/auth/callback"
]
enable_signup = true

[storage]
enabled = true
